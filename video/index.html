<!doctype html>
<html>
<head>

<style>
  :root { --ink:#10243A; --paper:#F8F5EC; --teal:#0f8f80; --coral:#c4552f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .blob { position: absolute; border-radius: 50%; transform: translate(-50%,-50%); }

  /* cards */
  .c { width: 300px; border-radius: 22px; background: #fff; padding: 12px; border: 1px solid rgba(16,36,58,.07);
    box-shadow: 0 1px 2px rgba(16,36,58,.05), 0 12px 30px rgba(16,36,58,.08); }
  .c img { display: block; width: 100%; height: 170px; object-fit: cover; border-radius: 14px; }
  .c .b { display: flex; gap: 14px; align-items: center; padding: 10px 6px 4px; }
  .c .ic { width: 58px; height: 58px; border-radius: 15px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .c .k { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #56616e; }
  .c .t { font-size: 23px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; margin-top: 2px; }
  .c .n { font-family: 'Newsreader', serif; font-size: 25px; line-height: 1.35; padding: 8px 8px 6px; }
  .c .m { font-size: 16px; color: #56616e; margin-top: 4px; }
  .c .kept { font-size: 16px; color: #56616e; padding: 2px 6px 4px; text-align: right; }

  .keepbtn { position: absolute; right: 22px; top: 22px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 18px; padding: 8px 16px; border-radius: 999px; }
  .mc { width: 220px; border-radius: 18px; background: #fff; padding: 8px; box-shadow: 0 8px 22px rgba(16,36,58,.07); }
  .mc img { display: block; width: 100%; height: 120px; object-fit: cover; border-radius: 12px; }
  .mc .e { height: 120px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 56px; }
  .mc .l { height: 14px; width: 70%; border-radius: 7px; background: rgba(16,36,58,.12); margin: 12px 4px 6px; }

  /* the messy browser */
  .win { width: 1560px; height: 820px; border-radius: 26px; background: #fbf9f3; border: 1px solid rgba(16,36,58,.08);
    box-shadow: 0 30px 80px rgba(16,36,58,.12); overflow: hidden; }

  .tab { height: 50px; flex: 0 0 150px; background: #f6f2e8; border-radius: 12px 12px 0 0; display: flex; align-items: center; gap: 8px; padding: 0 12px;

  .chip { font-size: 17px; font-weight: 700; color: #0a5a51; background: #DDF3EF; padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
  .gz { border-radius: 60px; background: rgba(255,255,255,.45); }

  /* type */
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #wash { position: absolute; left: 0; top: 0; width: 1500px; height: 520px; opacity: 0;
    background: radial-gradient(ellipse 70% 60% at 0% 0%, rgba(248,245,236,.96) 0%, rgba(248,245,236,.85) 45%, rgba(248,245,236,0) 100%); }

  .acc { font-family: 'Newsreader', serif; font-style: italic; font-weight: 500; }
  .teal { color: var(--teal); } .coral { color: var(--coral); }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .06em .16em 0; margin: 0 -.06em -.16em 0; }

  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 75% at 50% 50%, rgba(16,36,58,0) 60%, rgba(16,36,58,.10) 100%); }
  #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: .06; mix-blend-mode: multiply; }
  .cta { font-size: 32px; font-weight: 600; background: var(--ink); color: var(--paper); padding: 20px 44px; border-radius: 999px; display: inline-block; }

<body>
<div id="cam"><div id="dots"></div><div id="bg"></div><div id="world"></div></div>
<div id="ui"><div id="scrimA" style="position:absolute;left:0;right:0;bottom:0;height:460px;opacity:0;background:linear-gradient(to top, rgba(8,16,28,.82) 0%, rgba(8,16,28,.55) 45%, rgba(8,16,28,0) 100%)"></div><div id="wash"></div><div id="washE" style="position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;background:radial-gradient(ellipse 58% 42% at 22% 12%, rgba(248,245,236,1) 0%, rgba(248,245,236,.98) 55%, rgba(248,245,236,0) 100%)"></div><div id="paperwash"></div></div>

<script>
// ---------------- helpers ----------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eIO5 = x => x < .5 ? 16 * Math.pow(x, 5) : 1 - Math.pow(-2 * x + 2, 5) / 2;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eOut5 = x => 1 - Math.pow(1 - x, 5);
const eBack = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const world = document.getElementById('world'), bg = document.getElementById('bg'), ui = document.getElementById('ui');
function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || world).appendChild(e); return e; }
function place(e, x, y, s = 1, o = 1, r = 0) { e.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) scale(${s}) rotate(${r}deg)`; e.style.opacity = o; e.style.visibility = o > 0.001 ? 'visible' : 'hidden'; }
const fmt = n => Math.round(n).toLocaleString('en-US');
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function C(o, parent) {
  const c = el('div', 'c abs', parent);
  if (o.w) c.style.width = o.w + 'px';
  if (o.note) c.innerHTML = `<div class="b" style="padding-bottom:0"><div class="k">Note</div></div><div class="n">${o.note}</div>`;
  else c.innerHTML = `${o.img ? `<img src="web/${o.img}">` : ''}<div class="b">${o.e ? `<div class="ic" style="background:${o.bg}">${o.e}</div>` : ''}<div><div class="k">${o.k}</div><div class="t">${o.t}</div>${o.m ? `<div class="m">${o.m}</div>` : ''}</div></div>`;
  if (o.kept) c.innerHTML += `<div class="kept">kept by <b>${fmt(o.kept)}</b></div>`;
  c.style.visibility = 'hidden';
  return c;
}
const SFX = []; const sfx = (t, type, i = 0) => SFX.push({ t: +t.toFixed(3), type, i });

// kinetic type: segments [[text, cls], ...]
function T(lines, style, parent) {
  const box = el('div', 'ttl', parent || ui); if (style) box.style.cssText += style;
  const rows = lines.map(([cls, segs]) => { const r = el('div', cls, box); const words = [];
    segs.forEach(([txt, sc]) => txt.split(' ').filter(Boolean).forEach((w, i, a) => { const o = el('span', 'w ' + (sc || ''), r); const inner = el('span', '', o, w); words.push(inner); r.appendChild(document.createTextNode(' ')); }));
    return words; });
  box.style.opacity = 0; return { box, rows };
}
function showT(T0, t, a, b, stagger = .055) {
  let vis = 0;
  T0.rows.forEach((words, ri) => words.forEach((w, i) => {
    const s = a + ri * .28 + i * stagger, p = eOut5(prog(t, s, s + .75));
    const q = b == null ? 0 : eIO(prog(t, b + i * .025, b + .45 + i * .025));
    w.style.transform = `translateY(${(1 - p) * 110 - q * 110}%)`;
    vis = Math.max(vis, p * (1 - q));
  }));
  T0.box.style.opacity = vis > 0 ? 1 : 0;
  return vis;
}

// ---------------- camera ----------------
const K = [ // t, x, y, z
  [0, 10, -29, 7.4], [4.1, 10, -29, 6.7], [7.3, 30, -90, 1.0], [12.2, 30, -90, 1.0], [13.4, 0, 20, 1.25], [18.5, 0, 20, 1.25],
  [21.2, 0, -60, .72], [26.4, 0, -60, .72], [28.6, 0, -100, .55], [30.4, 0, -100, .55], [31.9, 0, -80, 1.05], [37.3, 0, -80, 1.05],
  [39.3, -1300, -340, 1.15], [42.3, -1300, -340, 1.15], /* tracked flight 42.3–46.0 */ [46.0, 1400, 1260, 1.15], [46.8, 1400, 1260, 1.15],
  [49.8, 0, 500, .16], [55.6, 0, 520, .16], [58.2, 1600, 1180, .92], [62.9, 1600, 1180, .92], [64.4, 1415, 1165, 2.6], [68.8, 1415, 1165, 2.6],
  [71.4, 0, 550, .165], [77.4, 0, 550, .158],
];
const Y = { x: 1400, y: 1275 }, SLOT = { x: 1235, y: 1518 };
function camAt(t) {
  if (t > 42.3 && t < 46.0) { // follow the kept thing
    const p = eIO(prog(t, 42.3, 46.0));
    const bx = (1 - p) * (1 - p) * -1300 + 2 * (1 - p) * p * 100 + p * p * 1400;
    const by = (1 - p) * (1 - p) * -340 + 2 * (1 - p) * p * -250 + p * p * 1260;
    return { x: bx, y: by, z: 1.15 - Math.sin(p * Math.PI) * .55 };
  }
  let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
  const [t0, x0, y0, z0] = K[i], [t1, x1, y1, z1] = K[i + 1];
  const p = eIO5(prog(t, t0, t1));
  return { x: lerp(x0, x1, p), y: lerp(y0, y1, p), z: Math.exp(lerp(Math.log(z0), Math.log(z1), p)) };
}
[18.6, 30.4, 37.4, 55.7, 62.9].forEach(t => sfx(t, 'whoosh')); [42.3, 46.9, 68.9].forEach(t => sfx(t, 'whooshL'));

// ---------------- background depth ----------------
for (let i = 0; i < 70; i++) { const b = el('div', 'blob', bg); const s = 300 + rnd() * 900;
  b.style.width = b.style.height = s + 'px'; b.style.left = (rnd() - .5) * 16000 + 'px'; b.style.top = (rnd() - .5) * 10000 + 'px';
  const c = ['127,209,199', '255,158,122', '242,178,51', '164,180,230'][i % 4];
  b.style.background = `radial-gradient(circle, rgba(${c},.16) 0%, rgba(${c},0) 70%)`; }

// ================= A: something wonderful, then gone =================
const win = el('div', 'win abs');
const tabsEl = el('div', 'tabs', win);
const tabNames = [['🌊', 'The Great Wave off…'], ['⌚', 'Mechanical Watch'], ['📜', 'Hope is the thing…'], ['🐙', 'Cephalopod intel…'], ['📻', 'Radio Garden'], ['📄', 'untitled (3)'], ['🔖', 'Read later'], ['💬', 'New chat'], ['🎥', 'Watch later'], ['📚', 'Reading list'], ['🧩', 'that one game'], ['❓', 'where was it']];
const tabs = tabNames.map(([e, n]) => el('div', 'tab', tabsEl, `<span>${e}</span>${n}`));
const side = el('div', 'side', win, '<h4>Bookmarks</h4>');
const bms = ['📁 Read later (212)', '📁 Unsorted', '📁 cool stuff', '📁 cool stuff 2', '📁 misc', '📁 Watch later', '📁 untitled folder', '📁 old bookmarks (2019)'].map(b => el('div', 'bm', side, b));
const chat = el('div', 'chat', win);
const bubs = [['look at this 🌊', 1], ['saving this for later', 1], ['omg yes', 0], ['wait, where was that link?', 1], ['no idea, scroll up?', 0], ['can’t find it anymore', 1]].map(([t, me]) => el('div', 'bub' + (me ? ' me' : ''), chat, t));
const clutter = [
  [C({ img: 'ciechanow-ski-3.png', k: 'Explorable', t: 'How a watch works' }), -250, -165, .82, -5],
  [C({ note: 'Hope is the thing with feathers, that perches in the soul.' }), 270, -185, .82, 4],
  [C({ img: 'octopus.jpg', k: 'Essay', t: 'Octopus minds' }), -240, 215, .82, 3],
  [C({ img: 'radio-garden-0.jpg', k: 'Toy', t: 'Radio from anywhere' }), 255, 230, .82, -4],
];
const wave = C({ img: 'great-wave-hi.jpg', k: 'Art', t: 'The Great Wave off Kanagawa' });
const tA1 = T([['h', [['You found something', ''], ['wonderful.', 'acc']]]], 'top:auto;bottom:96px;color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.45)');
tA1.box.classList.add('over-ok'); // deliberately over the painting, on its own dark scrim
sfx(0.9, 'swell');

// ================= the sprout (drawn once per use; p = growth 0..1) =================
let sproutN = 0;
function makeSprout(parent) {
  const n = ++sproutN, box = el('div', 'abs', parent); box.style.cssText += 'width:360px;height:380px';
  box.innerHTML = `<svg width="360" height="380" viewBox="-180 -340 360 380" style="display:block;overflow:visible"><defs>
    <radialGradient id="glow${n}"><stop offset="0" stop-color="rgba(242,178,51,.22)"/><stop offset="1" stop-color="rgba(242,178,51,0)"/></radialGradient>
    <radialGradient id="soil${n}"><stop offset="0" stop-color="rgba(90,64,48,.34)"/><stop offset="1" stop-color="rgba(90,64,48,0)"/></radialGradient>
    <linearGradient id="stemG${n}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2b7a52"/><stop offset="1" stop-color="#5dbb83"/></linearGradient>
    <linearGradient id="leafA${n}" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3fae7c"/><stop offset=".6" stop-color="#7fd1a6"/><stop offset="1" stop-color="#b9ecd0"/></linearGradient>
    <linearGradient id="leafB${n}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2f9f8a"/><stop offset=".55" stop-color="#7FD1C7"/><stop offset="1" stop-color="#c8f0e6"/></linearGradient></defs>
    <circle class="sg" cx="0" cy="-150" r="210" fill="url(#glow${n})"/>
    <ellipse class="ss" cx="0" cy="8" rx="170" ry="22" fill="url(#soil${n})"/>
    <path class="sm" d="M-74 10 C -50 -12, 50 -12, 74 10 Z" fill="#7a5a44" opacity=".55"/>
    <g class="sp"><path class="st" d="M0 4 C 4 -50, -12 -110, -2 -150 S 6 -200, 2 -228" stroke="url(#stemG${n})" stroke-width="10" fill="none" stroke-linecap="round"/>
      <g class="l1"><path d="M0 0 C -28 -4, -80 -24, -112 -70 C -64 -84, -16 -56, 0 0 Z" fill="url(#leafB${n})"/><path d="M-4 -4 Q -54 -30 -104 -68" stroke="rgba(255,255,255,.6)" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
      <g class="l2"><path d="M0 0 C 32 -8, 98 -36, 124 -92 C 70 -100, 18 -64, 0 0 Z" fill="url(#leafA${n})"/><path d="M4 -4 Q 62 -40 116 -88" stroke="rgba(255,255,255,.6)" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
      <g class="l3"><path d="M0 0 C -9 -14, -7 -34, 3 -48 C 13 -32, 11 -14, 0 0 Z" fill="#9BE0B4"/></g></g></svg>`;
  const q = s => box.querySelector(s), st = q('.st'), L = st.getTotalLength(); st.style.strokeDasharray = L;
  return { box, set(p, t, o = 1) {
    st.style.strokeDashoffset = L * (1 - eOut(prog(p, .05, .5)));
    const leaf = (g, x, y, a, b, r0, fl) => { const k = eBack(prog(p, a, b)); g.setAttribute('transform', `translate(${x} ${y}) rotate(${lerp(r0, 0, clamp(k, 0, 1)) + Math.sin(t * 1.7 + fl) * 2.2 * clamp(k)}) scale(${clamp(k, 0, 1.15)})`); };
    leaf(q('.l1'), -2, -150, .32, .72, 70, 0); leaf(q('.l2'), 0, -190, .46, .86, -70, 1.3); leaf(q('.l3'), 2, -226, .7, 1, 0, 2.1);
    q('.sp').setAttribute('transform', `rotate(${Math.sin(t * 1.1) * 1.6 * eOut(prog(p, .5, 1))})`);
    q('.sm').style.opacity = .55 * eOut(prog(p, 0, .15)); q('.ss').style.opacity = eOut(prog(p, 0, .2)); q('.sg').style.opacity = eOut(prog(p, .4, 1));
    box.style.opacity = o; box.style.visibility = o > .001 && p > 0 ? 'visible' : 'hidden'; } };
}

// ================= C: keep anything → gardens → path =================
const pathSvg = el('div', 'abs'); pathSvg.innerHTML = `<svg width="1400" height="40" viewBox="-700 -20 1400 40" style="display:block"><path id="pl" d="M-630 0 L 630 0" stroke="#0f8f80" stroke-width="6" stroke-dasharray="4 16" stroke-linecap="round" fill="none"/></svg>`;
const pl = pathSvg.querySelector('#pl');
const defs = [
  { img: 'octopus.jpg', k: 'Video', t: 'An octopus opens a jar', kept: 88 },   // 0
  { img: 'pudding-cool-16.jpg', k: 'Essays', t: 'The Pudding' },          // 1
  { e: '📕', bg: '#FFE3D6', k: 'Book', t: 'Other Minds', kept: 412 },     // 2
  { e: '🎧', bg: '#E4E8F7', k: 'Podcast', t: 'Do octopuses dream?', kept: 57 }, // 3
  { note: 'Two thirds of the neurons are in the arms.' },                 // 4
  { img: 'ocw-mit-edu-29.jpg', k: 'Course', t: '18.06 Linear Algebra' },  // 5
  { e: '🐍', bg: '#DDF3EF', k: 'Game', t: 'Matrix Snake' },               // 6
  { img: 'redblobgames-com-11.jpg', k: 'Explorable', t: 'Hexagonal grids' }, // 7
  { img: 'ciechanow-ski-4.png', k: 'Explorable', t: 'How GPS works' },    // 8
  { img: 'starry-night.jpg', k: 'Art', t: 'The Starry Night' },           // 9
  { img: 'pale-blue-dot.png', k: 'Photo', t: 'Pale Blue Dot' },           // 10
  { img: 'earth-nullschool-net-10.jpg', k: 'Live map', t: 'The wind, right now' }, // 11
  { note: 'A matrix is a machine that moves space.' },                    // 12
  { e: '▶️', bg: '#FFD0BD', k: 'Video', t: 'Eigenvectors in 60 seconds' },  // 13
];
const cards = defs.map(o => C(o));
const PA = [[-1350, -380], [-700, -560], [380, -620], [1050, -520], [1500, -200], [-1500, 250], [-850, 120], [850, 160], [1450, 480], [-1100, 650], [-350, 560], [350, 620], [1000, 760], [20, -400]];
const landOrder = [9, 0, 5, 2, 11, 4, 6, 8, 1, 10, 3, 7, 13, 12];
const PAof = i => { const [x, y] = PA[landOrder.indexOf(i)]; return [x * .74, (y + 60) * .64]; };
const GO = { x: -1300, y: -100 }, GL = { x: 0, y: -100 }, GU = { x: 1300, y: -100 };
const cell = (g, c, r) => [g.x + (c ? 165 : -165), g.y + (r - .5) * 260 - (r === 2 ? 0 : 0)];
const PB = []; PB[0] = cell(GO, 0, 0); PB[2] = cell(GO, 1, 0); PB[3] = cell(GO, 1, 1); PB[4] = cell(GO, 0, 1);
PB[5] = cell(GL, 0, 0); PB[7] = cell(GL, 1, 0); PB[13] = cell(GL, 0, 1); PB[6] = cell(GL, 1, 1); PB[12] = cell(GL, 0, 2);

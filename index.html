<style>

  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }

  .thing.enter { animation: rise .8s cubic-bezier(.2,.7,.2,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.975); } }
  .kept { display: inline-block; transition: color .3s; }
  .kept.bump { animation: bump .6s cubic-bezier(.2,.7,.2,1); color: #c4552f; }
  @keyframes bump { 30% { transform: scale(1.18); } }
  .heart { position: absolute; pointer-events: none; color: #e08a68; font-size: 18px; animation: float 1.4s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes float { from { opacity: 0; transform: translate(0,0) scale(.6); } 20% { opacity: 1; transform: translate(0,-10px) scale(1.1); } to { opacity: 0; transform: translate(-6px,-46px) scale(.9); } }
  .link img { transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  @media (hover: hover) { .link:hover img { transform: scale(1.02); } }
  .k { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .t { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; margin-top: 3px; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .kept::before { content: '♥ '; color: #e08a68; }
  .row { display: flex; gap: 12px; align-items: center; }
  .ic { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none; }
  .note p { font-family: 'Newsreader', serif; font-size: 18px; line-height: 1.4; }
  .link .dom { font-size: 13px; color: var(--muted); }
  .link .strip { height: 70px; border-radius: 10px; margin-bottom: 10px; }
  .link img { display: block; width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; background: #F1ECE0; }
  .link a { color: inherit; text-decoration: none; }
  .video .thumb { height: 120px; border-radius: 10px; margin-bottom: 10px; background: linear-gradient(135deg,#10243A,#2b4a6b);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 30px; }
  .flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  .live { cursor: default; }
  .live .tag { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--teal); }

  .moon { font-size: 54px; line-height: 1; margin-top: 8px; }

  #card .lede { font-family: 'Newsreader', serif; font-size: 21px; line-height: 1.45; color: rgba(16,36,58,.75); margin-top: 16px; }
  #card .stance { font-size: 16px; font-weight: 600; letter-spacing: -0.005em; color: #0a5a51; margin-top: 14px; }

  .wander { background: none; border: 0; font: 600 14px 'Bricolage Grotesque'; color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

<div id="view"><div id="world"></div></div>

<section id="card" aria-label="Reserve yours">
  <div class="mark">Grdn</div>

</section>

// ---------- rendering ----------
const world = document.getElementById('world');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

}

      paths += `<path data-i="${i}" d="M0 0 L${70 * Math.cos(a0)} ${70 * Math.sin(a0)} A70 70 0 0 1 ${70 * Math.cos(a1)} ${70 * Math.sin(a1)} Z" fill="#FBE3C4" stroke="#fff" stroke-width="3"/>`; }
    return `<div class="thing live pizza">${head('Game', 'Fraction Pizza')}<div class="row" style="margin-top:10px"><svg width="150" height="150" viewBox="-75 -75 150 150"><circle r="73" fill="#e5b87a"/>${paths}</svg><div class="serif" style="font-size:36px" data-out>0/8</div></div><div class="meta"><span>tap the slices</span><span class="kept">kept by 1,204</span></div></div>`;
  }
  if (kind === 'palette') return `<div class="thing live">${head('Tool', 'Palette maker')}<div class="palette" data-pal>${'<div></div>'.repeat(5)}</div><div class="meta"><span>tap for another</span><span class="kept">kept by 522</span></div></div>`;
  if (kind === 'synth') return `<div class="thing live">${head('Toy', 'Tiny synth')}<div class="keys">${['C', 'D', 'E', 'G', 'A', 'C'].map((n, i) => `<button data-f="${[261.6, 293.7, 329.6, 392, 440, 523.3][i]}">${n}</button>`).join('')}</div><div class="meta"><span>play a tune</span><span class="kept">kept by 318</span></div></div>`;
  if (kind === 'dice') return `<div class="thing live">${head('Tool', 'Two dice')}<div class="dice" data-dice>⚂⚄</div><div class="meta"><span>tap to roll</span><span class="kept">kept by 141</span></div></div>`;
  if (kind === 'moon') return `<div class="thing live">${head('App', 'Moon tonight')}<div class="row"><div class="moon" data-moon></div><div class="serif" style="font-size:20px" data-moontxt></div></div><div class="meta"><span>live</span><span class="kept">kept by 87</span></div></div>`;
}
const COLS = 6, COLW = 640, GAP = 70;
const heights = Array(COLS).fill(60);
const order = [2, 3, 1, 4, 0, 5]; // fill the middle first
G.forEach((g, i) => {
  const d = document.createElement('div'); d.className = 'garden';
  d.innerHTML = `<header><h2>${esc(g.name)}</h2><span class="by">${esc(g.by)}</span></header><div class="cols"><div class="col"></div><div class="col"></div></div>`;

    (cols[0].offsetHeight <= cols[1].offsetHeight ? cols[0] : cols[1]).appendChild(el); });
  let c = order[0]; for (const k of order) if (heights[k] < heights[c] - 40) c = k;

  heights[c] += d.offsetHeight + GAP;

document.querySelectorAll('[data-pal]').forEach(p => { const roll = () => { const h = Math.random() * 360; [...p.children].forEach((c, i) => c.style.background = hsl((h + i * 28) % 360, 45 + i * 6, 88 - i * 14)); }; roll(); p.addEventListener('click', roll); });

  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .6); b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 150); }));
const faces = '⚀⚁⚂⚃⚄⚅'; document.querySelectorAll('[data-dice]').forEach(d => d.addEventListener('click', () => { let n = 0; const iv = setInterval(() => {
  d.textContent = faces[Math.random() * 6 | 0] + faces[Math.random() * 6 | 0]; if (++n > 8) clearInterval(iv); }, 60); }));
(() => { const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14) / 864e5; const age = (((Date.now() / 864e5 - ref) % syn) + syn) % syn;
  const idx = Math.round(age / syn * 8) % 8, lit = Math.round((1 - Math.cos(2 * Math.PI * age / syn)) / 2 * 100);
  const names = ['New moon', 'Waxing crescent', 'First quarter', 'Waxing gibbous', 'Full moon', 'Waning gibbous', 'Last quarter', 'Waning crescent'];
  document.querySelectorAll('[data-moon]').forEach(m => m.textContent = [...'🌑🌒🌓🌔🌕🌖🌗🌘'][idx]);
  document.querySelectorAll('[data-moontxt]').forEach(m => m.innerHTML = `${names[idx]}<br><span style="font-size:15px;color:var(--muted)">${lit}% lit</span>`); })();

// ---------- pan everywhere, pinch zoom on touch screens only, gentle drift until touched ----------
const view = document.getElementById('view');
const ZMAX = 1.5; let ZMIN = .35;
const setZmin = () => { ZMIN = Math.max(.35, innerHeight / (Math.min(...colP) - maxGH - 80), innerWidth / (PW - COLW - 80)); };
setZmin();
let z = innerWidth < 700 ? .72 : .82;
let px = innerWidth / 2 - WW * z / 2, py = innerHeight / 2 - WH * z / 2, drifting = true, t0 = performance.now();
const wrap = () => { // place each garden in the copy of the loop nearest the view; no clones
  const L = -px / z, T = -py / z;
  for (const t of tiles) {
    const x = t.x0 + PW * Math.ceil((L - COLW - t.x0) / PW), P = colP[t.c], y = t.y0 + P * Math.ceil((T - t.h - 80 - t.y0) / P);
    if (x !== t.x) { t.el.style.left = x + 'px'; t.x = x; } if (y !== t.y) { t.el.style.top = y + 'px'; t.y = y; }
  }
};
const apply = () => { z = Math.min(ZMAX, Math.max(ZMIN, z)); world.style.transform = `translate(${px}px,${py}px) scale(${z})`; wrap(); };
function zoomAt(nz, cx, cy) { nz = Math.min(ZMAX, Math.max(ZMIN, nz)); px = cx - (cx - px) * nz / z; py = cy - (cy - py) * nz / z; z = nz; apply(); }
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (calm) drifting = false;
let vx = 0, vy = 0, zoomAnim = null;
(function drift(now) {

  else if (drifting) { const s = (now - t0) / 1000; px += Math.cos(s * .12) * .35; py += Math.sin(s * .09) * .22; apply(); }
  else if (!drag && (Math.abs(vx) > .05 || Math.abs(vy) > .05)) { px += vx; py += vy; vx *= .94; vy *= .94; apply(); }

})(t0);
let drag = null; const pts = new Map(); let pinch = null;
const mid = () => { const [a, b] = [...pts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) }; };
view.addEventListener('pointerdown', e => {
